<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes habitudes</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Habitudes">
<meta name="theme-color" content="#F6F2EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151A17" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#F6F2EA; --card:#FFFDF8; --ink:#1F2A24; --muted:#6E7A72; --faint:#E7E1D5; --line:#E2DBCD;
  --green:#2F7D5B; --green-soft:#DDEEE4; --today:#C8553D;
  --sport:#E07A5F; --alim:#D99A2B; --mental:#6C7FD8; --other:#9AA39D;
  --shadow:0 1px 0 rgba(31,42,36,.04), 0 6px 20px -12px rgba(31,42,36,.25);
  --serif: ui-serif, "New York", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#151A17; --card:#1E2521; --ink:#EEF1EC; --muted:#9AA69F; --faint:#2A332E; --line:#2E3832;
    --green:#5DBB8E; --green-soft:#1F3A2D; --today:#F08A6E; --shadow:none; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:16px; -webkit-font-smoothing:antialiased}
body{min-height:100vh; padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
input{font:inherit}
.hidden{display:none!important}

header.top{position:sticky; top:0; z-index:5; padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;
  background:color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  display:flex; align-items:center; gap:10px}
header.top .t{flex:1; min-width:0}
header.top .eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600}
header.top h1{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:var(--serif); font-weight:600; font-size:28px; margin:2px 0 0; line-height:1.1; letter-spacing:-.01em}
.iconbtn{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:var(--card); box-shadow:var(--shadow); border:1px solid var(--line)}
.iconbtn svg{width:20px; height:20px}
.sync{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:20px; background:var(--card); border:1px solid var(--line); white-space:nowrap}
.sync i{width:8px; height:8px; border-radius:50%; background:var(--green)}
.sync.saving i,.sync.loading i{background:var(--alim); animation:pulse 1s infinite}
.sync.offline i{background:var(--muted)} .sync.error i{background:var(--today)}
@keyframes pulse{50%{opacity:.3}}

main{padding:4px 16px 24px; max-width:640px; margin:0 auto}
.card{background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); padding:16px}
h2{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:700; margin:26px 4px 10px}
.banner{margin:8px 0 4px; padding:12px 14px; border-radius:14px; background:var(--green-soft); font-size:14px; display:flex; gap:10px; align-items:center}
.banner.warn{background:color-mix(in srgb, var(--today) 16%, var(--card))}
.banner button{margin-left:auto; font-weight:600; color:var(--green); white-space:nowrap}
.banner.warn button{color:var(--today)}

/* Bande des jours */
.days{display:flex; gap:6px; overflow-x:auto; scroll-snap-type:x proximity; padding:6px 2px 10px; margin:0 -16px; padding-left:16px; padding-right:16px; scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 46px; scroll-snap-align:center; border-radius:14px; padding:8px 0 7px; text-align:center; background:var(--card); border:1px solid var(--line)}
.day small{display:block; font-size:11px; color:var(--muted); font-weight:600}
.day b{display:block; font-size:17px; margin:2px 0 4px; font-variant-numeric:tabular-nums}
.day .bar{height:3px; margin:0 9px; border-radius:2px; background:var(--faint); overflow:hidden}
.day .bar span{display:block; height:100%; background:var(--green)}
.day.today b{color:var(--today)}
.day.sel{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.day.sel small{color:color-mix(in srgb, var(--bg) 70%, transparent)} .day.sel b{color:var(--bg)}
.day.sel .bar{background:color-mix(in srgb, var(--bg) 25%, transparent)}

/* Anneau */
.hero{display:flex; align-items:center; gap:16px}
.ring{position:relative; flex:0 0 auto}
.ring svg{display:block; transform:rotate(-90deg)}
.ring .lbl{position:absolute; inset:0; display:grid; place-items:center; text-align:center; font-weight:700; font-variant-numeric:tabular-nums}
.ring .lbl small{display:block; font-size:11px; font-weight:600; color:var(--muted)}
.hero .msg{font-family:var(--serif); font-size:19px; line-height:1.3}
.hero .sub{color:var(--muted); font-size:14px; margin-top:4px}

/* Habitudes */
.list{display:flex; flex-direction:column; gap:8px}
.habit{width:100%; text-align:left; display:flex; align-items:center; gap:12px; padding:13px 14px; background:var(--card); border:1px solid var(--line); border-radius:16px; transition:background .2s, transform .1s}
.habit:active{transform:scale(.985)}
.habit .dot{width:10px; height:10px; border-radius:50%; flex:0 0 auto}
.habit .nm{flex:1; min-width:0}
.habit .nm b{display:block; font-weight:600; font-size:16px}
.habit .nm small{color:var(--muted); font-size:12.5px}
.check{width:30px; height:30px; flex:0 0 auto; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; transition:all .2s}
.check svg{width:16px; height:16px; opacity:0; transform:scale(.4); transition:all .2s; color:#fff}
.habit.done{background:var(--green-soft); border-color:transparent}
.habit.done .nm b{color:var(--green)}
.habit.done .check{background:var(--green); border-color:var(--green)}
.habit.done .check svg{opacity:1; transform:none}
.habit.unplanned{opacity:.7}
.disclose{width:100%; margin-top:14px; padding:12px; border-radius:14px; color:var(--muted); font-size:14px; font-weight:600; border:1px dashed var(--line)}

/* Tuiles et barres */
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px}
.tile{padding:12px; border-radius:16px; background:var(--card); border:1px solid var(--line)}
.tile small{display:block; color:var(--muted); font-size:11.5px; font-weight:600}
.tile b{display:block; font-size:19px; margin-top:4px; font-variant-numeric:tabular-nums}
.meter{height:8px; border-radius:6px; background:var(--faint); overflow:hidden}
.meter span{display:block; height:100%; border-radius:6px}
.dom{display:grid; grid-template-columns:96px 1fr 44px; gap:10px; align-items:center; padding:7px 0; font-size:14.5px}
.dom em{font-style:normal; text-align:right; font-weight:700; font-variant-numeric:tabular-nums}
.chart{display:flex; align-items:flex-end; gap:2px; height:96px; padding-top:6px}
.chart div{flex:1; border-radius:3px 3px 1px 1px; background:var(--green); min-height:2px}
.chart div.future{background:var(--faint)} .chart div.today{background:var(--today)}
.axis{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:6px}
.hrow{width:100%; text-align:left; display:block; padding:12px 2px; border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .l1{display:flex; justify-content:space-between; gap:8px; font-weight:600}
.hrow .l1 span{font-variant-numeric:tabular-nums; color:var(--muted); font-weight:600; font-size:14px}
.hrow .meter{margin:8px 0 6px; height:6px}
.hrow small{color:var(--muted); font-size:12.5px}

/* Objectifs */
.goal{padding:14px 16px}
.goal + .goal{margin-top:8px}
.goal .l1{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.goal .l1 b{font-size:16px} .goal .l1 span{color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums}
.weeks{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:12px}
.wk{padding:10px 0; border-radius:12px; border:1.5px solid var(--line); font-size:13px; font-weight:700; color:var(--muted)}
.wk.cur{border-color:var(--ink); color:var(--ink)}
.wk.on{background:var(--green); border-color:var(--green); color:#fff}
.todo{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:13px 14px}
.todo + .todo{border-top:1px solid var(--line)}
.todo .box{width:24px; height:24px; border-radius:7px; border:2px solid var(--line); display:grid; place-items:center; flex:0 0 auto}
.todo .box svg{width:14px; height:14px; color:#fff; opacity:0}
.todo.on .box{background:var(--green); border-color:var(--green)} .todo.on .box svg{opacity:1}
.todo.on span{color:var(--muted); text-decoration:line-through}

/* Planning */
.seg{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; background:var(--faint); padding:4px; border-radius:14px}
.seg button{padding:9px 0; border-radius:10px; font-weight:700; font-size:14px; color:var(--muted)}
.seg button.on{background:var(--card); color:var(--ink); box-shadow:var(--shadow)}
.seg button.today:not(.on){color:var(--today)}
.timeline{position:relative; padding:4px 0}
.ti{display:grid; grid-template-columns:52px 14px 1fr 30px; gap:10px; align-items:start; padding:9px 0}
.tick{width:28px; height:28px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; margin-top:-3px}
.tick svg{width:14px; height:14px; color:#fff; opacity:0}
.tick.on{background:var(--green); border-color:var(--green)} .tick.on svg{opacity:1}
.ti time{font-size:13.5px; font-weight:700; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; padding-top:1px}
.ti .pt{width:10px; height:10px; border-radius:50%; border:2px solid var(--line); background:var(--card); margin-top:5px; position:relative}
.ti .pt::after{content:""; position:absolute; left:2px; top:12px; width:2px; height:30px; background:var(--line)}
.ti:last-child .pt::after{display:none}
.ti.now{background:var(--green-soft); border-radius:12px; margin:0 -8px; padding:9px 8px}
.ti.now .pt{background:var(--green); border-color:var(--green)}
.ti.now span b{display:block; font-size:11px; color:var(--green); letter-spacing:.06em; text-transform:uppercase}
.ti.past span{color:var(--muted)}

/* Feuille modale */
.sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:20; display:flex; align-items:flex-end; animation:fade .2s}
.sheet{width:100%; max-width:640px; margin:0 auto; background:var(--bg); border-radius:22px 22px 0 0; padding:10px 18px calc(22px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto; animation:up .25s ease}
.sheet .grab{width:40px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 12px}
.sheet h3{font-family:var(--serif); font-size:22px; margin:0}
.sheet p.sub{margin:4px 0 14px; color:var(--muted); font-size:14px}
@keyframes up{from{transform:translateY(40px); opacity:.4}} @keyframes fade{from{opacity:0}}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.cal .hd{text-align:center; font-size:12px; font-weight:700; color:var(--muted)}
.cal button{aspect-ratio:1; border-radius:12px; font-weight:600; font-variant-numeric:tabular-nums; border:1.5px solid var(--line); background:var(--card)}
.cal button.off{background:var(--faint); border-color:transparent; color:var(--muted)}
.cal button.done{background:var(--green); border-color:var(--green); color:#fff}
.cal button.today{border-color:var(--today)}
.legend{display:flex; gap:14px; font-size:12px; color:var(--muted); margin-top:12px}
.legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px}

/* Réglages / installation */
.form label{display:block; font-size:13px; font-weight:600; color:var(--muted); margin:14px 2px 6px}
.form input{width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink)}
.btn{display:block; width:100%; padding:15px; border-radius:14px; background:var(--green); color:#fff; font-weight:700; font-size:16px; text-align:center; margin-top:14px}
.btn.ghost{background:var(--card); color:var(--ink); border:1px solid var(--line)}
.btn.danger{background:var(--card); color:var(--today); border:1px solid var(--line)}
.row{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:13px 2px; border-bottom:1px solid var(--line); font-size:15px}
.row:last-child{border-bottom:0}
.row span:last-child{color:var(--muted); text-align:right; overflow-wrap:anywhere}
.pick{width:100%; text-align:left; padding:13px 14px; display:flex; justify-content:space-between; gap:10px; align-items:center}
.pick + .pick{border-top:1px solid var(--line)}
.pick small{color:var(--muted); display:block; font-size:12.5px}
.pick.on{color:var(--green); font-weight:700}
.code{font-family:ui-monospace,Menlo,monospace; font-size:13px; background:var(--faint); padding:10px 12px; border-radius:10px; overflow-wrap:anywhere; margin-top:6px}
.welcome{text-align:center; padding:40px 8px 10px}
.welcome img{width:84px; height:84px; border-radius:20px; box-shadow:var(--shadow)}
.welcome h1{font-family:var(--serif); font-size:30px; margin:18px 0 6px}
.welcome p{color:var(--muted); margin:0 auto; max-width:320px; line-height:1.45}
.steps{counter-reset:s; list-style:none; padding:0; margin:0}
.steps li{counter-increment:s; position:relative; padding:4px 0 14px 38px; line-height:1.45; font-size:15px}
.steps li::before{content:counter(s); position:absolute; left:0; top:2px; width:26px; height:26px; border-radius:50%; background:var(--ink); color:var(--bg); font-weight:700; font-size:13px; display:grid; place-items:center}
.empty{text-align:center; color:var(--muted); padding:30px 10px; font-size:15px}
.spinner{width:28px; height:28px; border-radius:50%; border:3px solid var(--faint); border-top-color:var(--green); animation:spin .8s linear infinite; margin:60px auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Barre d'onglets */
nav.tabs{position:fixed; left:0; right:0; bottom:0; z-index:10; display:grid; grid-template-columns:repeat(4,1fr);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom)); background:color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); border-top:1px solid var(--line)}
nav.tabs button{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; font-weight:600; color:var(--muted); padding:4px 0}
nav.tabs svg{width:24px; height:24px}
nav.tabs button.on{color:var(--green)}
.toast{position:fixed; left:16px; right:16px; bottom:calc(92px + env(safe-area-inset-bottom)); z-index:30; background:var(--ink); color:var(--bg); padding:13px 16px; border-radius:14px; font-size:14px; text-align:center; animation:up .25s}
</style>
</head>
<body>
<div id="app"></div>
<script src="jszip.min.js"></script>
<script src="config.js"></script>
<script src="xlsx.js"></script>
<script src="app.js"></script>
</body>
</html>
